<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Minigame lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=VT323&family=Yatra+One&display=swap">
<link rel="stylesheet" href="../style.css">

<style>
  #lab { position: absolute; inset: 0; display: flex; flex-wrap: wrap; gap: 10px; align-content: center; justify-content: center; padding: 16px; }
  #lab button { font-size: 18px; }
</style>
</head>
<body class="booted">
<div id="ui"></div>
<div id="touch"></div>
<div id="overlay"></div>
<div id="lab"></div>
<script src="../src/core.js"></script>
<script src="../src/input.js"></script>
<script src="../src/audio.js"></script>
<script src="minigames.js"></script>
<script>
  (() => {
    const N = window.N;
    N.systems.init();
    N.state.set('play');
    const lab = document.getElementById('lab');
    for (const g of N.minigames.list()) {
      const b = document.createElement('button');
      b.className = 'sign-btn alt'; b.textContent = g.title;
      b.onclick = () => { try { N.audio.unlock(); } catch (e) {} N.minigames.play(g.id, { difficulty: 0.4 }).then((r) => { window.__last = r; console.log('result', JSON.stringify(r)); }); };
      lab.appendChild(b);
    }
    // a tiny loop so N.input/audio systems tick (main.js is not loaded in the lab)
    let last = 0;
    function f(t) { requestAnimationFrame(f); const dt = Math.min(0.1, last ? (t - last) / 1000 : 0.016); last = t; N.systems.update(dt); }
    requestAnimationFrame(f);
  })();
</script>
</body>
</html>
